name: sheetopia
description: "A sheet music library manager."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.10.4

dependencies:
  cryptography_plus: ^3.0.0
  dbus_secrets: ^0.0.2
  diacritic: ^0.1.6
  dio: ^5.9.0
  dotted_border: ^3.1.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  extended_wrap: ^0.1.5
  file_picker: ^10.3.10
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_sharing_intent: ^2.0.4
  go_router: ^17.0.1
  image: ^4.7.2
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.11.3
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.2.17
  provider: ^6.1.5+1
  reactive_color_picker: ^2.2.2
  reactive_forms: ^18.2.0
  rxdart: ^0.28.0
  uuid: ^4.5.2
  wakelock_plus: ^1.4.0
  flutter_midi_command:
    git:
      url: https://github.com/juho05/FlutterMidiCommand
      ref: b321dbd755bfadb35a75f9330eb57acdaeb09555
  collection: ^1.19.1
  window_manager: ^0.5.1
  flutter_fullscreen: ^1.2.0
  share_plus: ^12.0.1
  cupertino_icons: ^1.0.8
  logger: ^2.7.0

dependency_overrides:
  path_provider_linux:
    path: ./dependency_overrides/path_provider_linux
  flutter_secure_storage_darwin:
    path: ./dependency_overrides/flutter_secure_storage_darwin
  flutter_secure_storage_linux:
    path: ./dependency_overrides/stubs/flutter_secure_storage_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  image_path: ./assets/icon/sheetopia.png

  android: true
  adaptive_icon_background: ./assets/icon/sheetopia-android-background.png
  adaptive_icon_foreground: ./assets/icon/sheetopia-android-foreground.png
  adaptive_icon_monochrome: ./assets/icon/sheetopia-android-monochrome.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  windows:
    generate: true
    icon_size: 256
    image_path: ./assets/icon/sheetopia-circle.png

  macos:
    image_path: ./assets/icon/sheetopia-macos.png
    generate: true

flutter_native_splash:
  web: false
  android: false
  color: "#fef7ff"
  color_dark: "#151218"
  image: assets/icon/sheetopia-circle.png

flutter:
  uses-material-design: true