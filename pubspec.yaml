name: sheetopia
description: "Sheet music app"
publish_to: 'none'

version: 0.7.0+4010

environment:
  sdk: ^3.12.0

dependencies:
  cryptography_plus: ^3.0.0
  dbus_secrets: ^0.1.0
  diacritic: ^0.1.6
  dio: ^5.9.0
  flutter_system_integration:
    git:
      url: https://github.com/juho05/flutter_system_integration
      ref: b461294075b732c4beea48221b0ba7453d980579
  dotted_border: ^3.1.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_secure_storage: ^11.0.0
  flutter_sharing_intent:
    git:
      url: https://github.com/juho05/flutter_sharing_intent
      ref: 66df86bb27eca12bc011e3a311bc78ca554af33d
  go_router: ^18.0.1
  image: ^4.9.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  json_serializable: ^6.11.3
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.2.17
  provider: ^6.1.5+1
  reactive_forms: ^18.2.0
  rxdart: ^0.28.0
  uuid: ^4.5.2
  wakelock_plus: ^1.6.1
  flutter_midi_command:
    git:
      url: https://github.com/juho05/FlutterMidiCommand
      ref: 49dc0306510b037367b45a3252a26fff8fbc4fd1
  collection: ^1.19.1
  window_manager: ^0.5.1
  flutter_fullscreen: ^1.2.0
  share_plus: ^13.1.0
  cupertino_icons: ^2.0.0
  logger: ^2.7.0
  logging: ^1.3.0
  dbus: ^0.8.0
  url_launcher: ^6.3.2
  io: ^1.0.5
  archive: ^4.0.9
  desktop_drop:
    git:
      url: https://github.com/juho05/desktop_drop
      ref: de849b252812db9dd2300697e8da8dff0ba1c024
  cross_file: ^0.3.5+2
  perfect_freehand: ^2.5.2+1
  material_symbols_icons: ^4.2951.0
  material_ui: ^1.4.0
  cupertino_ui: ^1.1.1
  predictive_transition:
    git:
      url: https://github.com/juho05/flutter_predictive_transition
      ref: 1c52b52ff1a257d263295d3ed612d465c42c7813
  cunning_document_scanner: ^3.0.1
  one_dollar_unistroke_recognizer: ^1.3.5

dependency_overrides:
  path_provider_linux:
    path: ./dependency_overrides/path_provider_linux
  flutter_secure_storage_linux:
    path: ./dependency_overrides/stubs/flutter_secure_storage_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  inno_bundle: ^0.12.0

flutter_launcher_icons:
  image_path: ./assets/icon/sheetopia.png

  android: true
  adaptive_icon_background: ./assets/icon/sheetopia-android-background.png
  adaptive_icon_foreground: ./assets/icon/sheetopia-android-foreground.png
  adaptive_icon_monochrome: ./assets/icon/sheetopia-android-monochrome.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  windows:
    generate: true
    icon_size: 256
    image_path: ./assets/icon/sheetopia-circle.png

  macos:
    image_path: ./assets/icon/sheetopia-macos.png
    generate: true

flutter_native_splash:
  web: false
  android: false
  color: "#fef7ff"
  color_dark: "#151218"
  image: assets/icon/sheetopia-circle.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/sheetopia-circle.png
    - assets/upgrade_messages.json
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSansSymbols_LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSymbols-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSymbols-Bold.ttf
          weight: 700

inno_bundle:
  id: 0e58be04-aee2-4ad5-84e5-40e7dd0dba1e
  name: Sheetopia
  description: Sheet music app
  publisher: juho05
  url: "https://github.com/juho05/sheetopia"
  updates_url: "https://github.com/juho05/sheetopia/releases/latest"
  admin: auto
  vc_redist: true
  languages:
    - English
