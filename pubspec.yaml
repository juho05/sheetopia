name: sheetopia
description: "A sheet music library manager."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.10.4

dependencies:
  dotted_border: ^3.1.0
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  extended_wrap: ^0.1.5
  file_picker: ^10.3.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_fullscreen: ^1.2.0
  go_router: ^17.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.2.17
  provider: ^6.1.5+1
  reactive_color_picker: ^2.2.2
  reactive_forms: ^18.2.0
  rxdart: ^0.28.0
  uuid: ^4.5.2
  wakelock_plus: ^1.4.0

dependency_overrides:
  path_provider_linux:
    path: ./dependency_overrides/path_provider_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  image_path: ./assets/icon/sheetopia.png

  android: true
  adaptive_icon_background: ./assets/icon/sheetopia-android-background.png
  adaptive_icon_foreground: ./assets/icon/sheetopia-android-foreground.png
  adaptive_icon_monochrome: ./assets/icon/sheetopia-android-monochrome.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  windows:
    generate: true
    icon_size: 256
    image_path: ./assets/icon/sheetopia-circle.png

  macos:
    image_path: ./assets/icon/sheetopia-macos.png
    generate: true

flutter_native_splash:
  web: false
  android: false
  color: "#fef7ff"
  color_dark: "#151218"
  image: assets/icon/sheetopia-circle.png

flutter:
  uses-material-design: true